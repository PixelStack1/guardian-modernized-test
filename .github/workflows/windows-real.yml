name: windows-real-test
on:
  workflow_dispatch:
  push:
    branches: [ modernize, main ]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install poetry + deps
        run: |
          python -m pip install poetry
          poetry install --no-interaction --no-root
      - name: Admin check
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) | Tee-Object logs/admin.txt
          poetry run python --version | Tee-Object -Append logs/admin.txt
      - name: Pytest
        run: poetry run pytest -v 2>&1 | Tee-Object logs/pytest.txt; exit $LASTEXITCODE
      - name: Real WinDivert driver test
        if: always()
        run: poetry run python ci/win_driver_test.py 2>&1 | Tee-Object logs/windivert.txt; exit $LASTEXITCODE
      - name: Driver state after test process exit
        if: always()
        run: |
          sc.exe query WinDivert 2>&1 | Tee-Object logs/sc_after_exit.txt
          driverquery | Select-String -Pattern WinDivert | Tee-Object -Append logs/sc_after_exit.txt
          Start-Sleep -Seconds 15
          "--- after 15 s more ---" | Tee-Object -Append logs/sc_after_exit.txt
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          "--- explicit sc stop WinDivert (documented manual cleanup) ---" | Tee-Object -Append logs/sc_after_exit.txt
          sc.exe stop WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          Start-Sleep -Seconds 3
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          "exit-check-done" | Tee-Object -Append logs/sc_after_exit.txt
          exit 0  # sc.exe returns 1060 when the service is absent (expected); results are in the log
      - name: Install UPX
        if: always()
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      - name: Build exe
        if: always()
        run: poetry run python -c "from guardian.build import build; build()" 2>&1 | Tee-Object logs/build.txt; exit $LASTEXITCODE
      - name: Smoke-launch exe (20 s, stdin closed)
        if: always()
        run: |
          New-Item -ItemType File -Force logs/empty_stdin.txt | Out-Null
          $exe = Get-ChildItem dist/Guardian-*.exe | Select-Object -First 1
          "exe: $($exe.FullName) size: $($exe.Length)" | Tee-Object logs/exe_launch.txt
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput logs/exe_stdout.txt -RedirectStandardError logs/exe_stderr.txt -RedirectStandardInput logs/empty_stdin.txt
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { "still running after 20s (PID $($p.Id)) -> stopping own PID" | Tee-Object -Append logs/exe_launch.txt; Stop-Process -Id $p.Id -Force } else { "exited with code $($p.ExitCode)" | Tee-Object -Append logs/exe_launch.txt }
          Start-Sleep -Seconds 2
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/exe_launch.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-windows-results
          path: |
            dist/Guardian-*.exe
            logs/
