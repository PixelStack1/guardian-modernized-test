name: windows-real-test
on:
  workflow_dispatch:
  push:
    branches: [ modernize, main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # build provenance attestation (this job only)
      attestations: write
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install poetry + deps
        run: |
          python -m pip install poetry==2.5.1
          poetry install --no-interaction --no-root
      - name: Admin check
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) | Tee-Object logs/admin.txt
          poetry run python --version | Tee-Object -Append logs/admin.txt
      - name: Pytest
        run: poetry run pytest -v 2>&1 | Tee-Object logs/pytest.txt; exit $LASTEXITCODE
      - name: Real WinDivert driver test
        if: always()
        run: poetry run python ci/win_driver_test.py 2>&1 | Tee-Object logs/windivert.txt; exit $LASTEXITCODE
      - name: Driver state after test process exit
        if: always()
        run: |
          sc.exe query WinDivert 2>&1 | Tee-Object logs/sc_after_exit.txt
          driverquery | Select-String -Pattern WinDivert | Tee-Object -Append logs/sc_after_exit.txt
          Start-Sleep -Seconds 15
          "--- after 15 s more ---" | Tee-Object -Append logs/sc_after_exit.txt
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          "--- explicit sc stop WinDivert (documented manual cleanup) ---" | Tee-Object -Append logs/sc_after_exit.txt
          sc.exe stop WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          Start-Sleep -Seconds 3
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/sc_after_exit.txt
          "exit-check-done" | Tee-Object -Append logs/sc_after_exit.txt
          exit 0  # sc.exe returns 1060 when the service is absent (expected); results are in the log
      - name: Build exe
        if: always()
        run: poetry run python -c "from guardian.build import build; build()" 2>&1 | Tee-Object logs/build.txt; exit $LASTEXITCODE
      - name: Smoke-launch exe (20 s, stdin closed)
        if: always()
        run: |
          New-Item -ItemType File -Force logs/empty_stdin.txt | Out-Null
          $exe = Get-ChildItem dist/Guardian-*.exe | Select-Object -First 1
          "exe: $($exe.FullName) size: $($exe.Length)" | Tee-Object logs/exe_launch.txt
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput logs/exe_stdout.txt -RedirectStandardError logs/exe_stderr.txt -RedirectStandardInput logs/empty_stdin.txt
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { "still running after 20s (PID $($p.Id)) -> stopping own PID" | Tee-Object -Append logs/exe_launch.txt; Stop-Process -Id $p.Id -Force } else { "exited with code $($p.ExitCode)" | Tee-Object -Append logs/exe_launch.txt }
          Start-Sleep -Seconds 2
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/exe_launch.txt
          exit 0
      - name: Exe normal exit -> driver must be removed
        if: always()
        run: |
          sc.exe stop WinDivert 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          "before:" | Tee-Object logs/exe_exit_driver.txt
          sc.exe query WinDivert 2>&1 | Tee-Object -Append logs/exe_exit_driver.txt
          $exe = Get-ChildItem dist/Guardian-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test-exit" -PassThru -RedirectStandardOutput logs/exe_selftest_stdout.txt -RedirectStandardError logs/exe_selftest_stderr.txt
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; "TIMEOUT (own PID $($p.Id) stopped)" | Tee-Object -Append logs/exe_exit_driver.txt; exit 1 }
          "exe exit code: $($p.ExitCode)" | Tee-Object -Append logs/exe_exit_driver.txt
          Get-Content logs/exe_selftest_stdout.txt, logs/exe_selftest_stderr.txt | Tee-Object -Append logs/exe_exit_driver.txt
          Get-Content "$env:LOCALAPPDATA\Guardian\history.log" -ErrorAction SilentlyContinue | Tee-Object -Append logs/exe_exit_driver.txt
          Start-Sleep -Seconds 3
          "after:" | Tee-Object -Append logs/exe_exit_driver.txt
          $q = (sc.exe query WinDivert 2>&1 | Out-String)
          $q | Tee-Object -Append logs/exe_exit_driver.txt
          if ($q -match "RUNNING") { "FAIL: WinDivert still running after Guardian exit" | Tee-Object -Append logs/exe_exit_driver.txt; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }
          "OK: WinDivert not running after Guardian exit" | Tee-Object -Append logs/exe_exit_driver.txt
          exit 0  # sc.exe query leaves $LASTEXITCODE=1060 when the service is absent (= success here)
      - name: SHA256SUMS of the exe
        if: always()
        run: |
          Get-ChildItem dist/Guardian-*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS | Tee-Object logs/sha256sums.txt
      - name: Build provenance attestation
        id: attest
        if: always()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Guardian-*.exe
      - name: Report attestation outcome
        if: always()
        run: |
          "attestation outcome: ${{ steps.attest.outcome }}" | Tee-Object logs/attestation.txt
          "attestation url: ${{ steps.attest.outputs.attestation-url }}" | Tee-Object -Append logs/attestation.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guardian-windows-results
          path: |
            dist/Guardian-*.exe
            dist/SHA256SUMS
            logs/
