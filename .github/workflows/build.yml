name: build

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        run: pipx install poetry==2.5.1
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Lint and test
        run: |
          poetry run ruff check .
          poetry run mypy guardian
          poetry run pytest -q
      - name: Build executable
        run: poetry run python -c "from guardian.build import build; build()"
      - name: SHA256SUMS
        run: |
          Get-ChildItem dist/Guardian-*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Guardian
          path: |
            dist/Guardian-*.exe
            dist/SHA256SUMS

  attest:
    # Build provenance only for tags. Write permissions are granted to this job only.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Guardian
          path: dist
      - name: Verify SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Guardian-*.exe
      - name: Report attestation outcome
        run: echo "attestation outcome=${{ steps.attest.outcome }} url=${{ steps.attest.outputs.attestation-url }}"
      # Release publishing intentionally removed in this fork (never publish from CI here).
