name: build

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          install-only: true
      - name: Lint and test
        run: |
          poetry run ruff check .
          poetry run mypy guardian
          poetry run pytest -q
      - name: Build executable
        run: poetry run python -c "from guardian.build import build; build()"
      - uses: actions/upload-artifact@v7
        with:
          name: Guardian
          path: dist/Guardian-*.exe
      # Release publishing intentionally removed in this fork (never publish from CI here).
