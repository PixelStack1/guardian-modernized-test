[tool.poetry]
name = "Guardian"
version = "3.6.1"
description = "Custom firewall used to create private lobbies for GTA5 Online"
authors = ["TheMythologist <leekaixuan2001@gmail.com>"]
license = "LGPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
colorama = "^0.4.6"
pyinstaller = "^6.16"
pydivert = "^4.0.1"
questionary = "^2.1.1"
tqdm = "^4.67.1"
requests = "^2.32.5"
PySide6 = "^6.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14"
pre-commit = "^4.3"
mypy = "^1.18"
types-colorama = "^0.4.15"
types-tqdm = "^4.67"
types-requests = "^2.32"
pytest = "^9.1.1"
hypothesis = "^6"
pytest-qt = "^4.4"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["guardian", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP046"]  # keep Generic[T] style for mypy/py3.12 compat

[tool.ruff.lint.isort]
known-first-party = ["config", "dispatcher", "menu", "network", "util", "validator"]

[tool.pytest.ini_options]
pythonpath = ["guardian", "."]
testpaths = ["tests"]

[tool.mypy]
platform = "win32"
exclude = ["speed_tests/", "tests/", "build.py", "tools/gui_screenshots.py"]
strict = true

[[tool.mypy.overrides]]
module = ["pydivert"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
